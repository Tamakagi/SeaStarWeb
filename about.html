<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>About | SeaStar</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/button.css" />
    <link rel="stylesheet" href="css/about.css" />
  </head>

  <body>
    <header id="header"></header>

    <section class="about">
      <div class="about__overlay">
        <div class="about__content">
          <p class="about__catch">VRChat Private RP Event</p>

          <h1 class="about__title">About</h1>

          <p class="about__description">
            IKUSIAアバターのキャストが姉妹メイドとしてお客様をおもてなし致します。<br />
            2対2個室接客RPイベント。
          </p>

          <!-- 開催情報 -->
          <div class="about__block">
            <h2>開催情報</h2>
            <ul>
              <li>毎週土曜日 22:30〜23:30</li>
              <li>Group+インスタンス開催</li>
              <li>VRChatアカウント必須</li>
            </ul>
          </div>

          <!-- ルール -->
          <div class="about__block">
            <h2>ルール</h2>
            <ul>
              <li>他参加者への迷惑行為は禁止</li>
              <li>RP（ロールプレイ）を尊重すること</li>
              <li>スタッフの指示に従うこと</li>
            </ul>
          </div>

          <!-- X埋め込み -->
          <div class="about__post">
            <blockquote class="twitter-tweet">
              <a href="https://x.com/VRC_SeaStar/status/投稿ID"></a>
            </blockquote>
          </div>

          <!-- ボタン -->
          <div class="about__button">
            <a
              href="https://x.com/VRC_SeaStar"
              class="button"
              target="_blank"
              rel="noopener noreferrer"
            >
              公式Xを見る
            </a>
          </div>
        </div>
      </div>
    </section>

    <script src="js/load-header.js"></script>
  </body>
</html>
